spring.application.name=SecLibTestApp
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

log4j.rootLogger=ALL

security.roleBasedAuthorizationEnabled=true
user.two-factor-auth-enabled=true
user.ip-locking-enabled=false
user.user-locking-enabled=true
user.password-policy-enabled=true
user.password-reset-enabled=true

user.ip-max-attempts= 3
user.ip-lock-time=  30000
user.user-max-attempts= 3
user.user-lock-time=  30000

user.password-policy.pattern=(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\\-=\\[\\]{};':\"\\\\|,.<>/?]).{8,}
user.password-policy.entropy=60

cors.allowed-headers=Origin,Content-Type,Accept,Authorization,x-csrf-token
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-origins=https://localhost:3000
cors.allow-credentials=true

security.roles.ADMIN.permissions=ReadPost,WritePost
security.roles.USER.permissions=ReadPost,WritePost
security.roles.GUEST.permissions=ReadPost
session.filter.loginRequired=false
session.filter.roleForUnauthenticatedUsers=GUEST

csp.directives=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none';

sanitizer.allowed-elements=a,b,i,u,strong,em,p,br
sanitizer.allowed-attributes=href,src
sanitizer.allowed-protocols=http,https

csrf.enabled=true
csrf.headerName=X-CSRF-TOKEN
csrf.parameterName=_csrf
csrf.refererDomain=https://localhost:3000

# Global strategy for all honeypots
honeypot.globalStrategy=STRICT

# Fake port honeypot configuration
honeypot.fakePorts=true
honeypot.fakePortStrategy=DUMMY
honeypot.fakePortHoneypotConfig.ports=8888,3333

# Fake cookie honeypot configuration
honeypot.fakeCookies=false
honeypot.fakeCookieStrategy=DUMMY

# Configuration for the first fake cookie honeypot
honeypot.fakeCookieHoneypotConfig[0].name=fake_session_token
honeypot.fakeCookieHoneypotConfig[0].value=unmodifiableValue1
honeypot.fakeCookieHoneypotConfig[0].httpOnly=true
honeypot.fakeCookieHoneypotConfig[0].path=/
honeypot.fakeCookieHoneypotConfig[0].maxAge=86400

google-oauth.client-id=
google-oauth.client-secret=
google-oauth.redirect-uri=https://localhost/oauth/google/callback
google-oauth.scopes=openid,profile,email
google-oauth.state=someRandomState
google-oauth.response-type=code
google-oauth.grant-type=authorization_code

github-oauth.client-id=
github-oauth.client-secret=
github-oauth.redirect-uri=https://localhost/oauth/github/callback
github-oauth.scopes=read:user,user:email
github-oauth.state=someRandomState
github-oauth.response-type=code
github-oauth.grant-type=authorization_code

server.port=443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=lol
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=tomcat